<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Event Management Planner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-light: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --venue-accent: #38bdf8;
      --logistics-accent: #10b981;
      --marketing-accent: #f43f5e;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
    header {
      background: var(--primary-grad);
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
    }
    header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
    header p { color: rgba(255,255,255,0.9); margin-top: 6px; font-size: 0.95rem; }

    .container { max-width: 1050px; margin: 28px auto; padding: 0 18px; display: grid; gap: 22px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #818cf8; }

    .btn {
      background: var(--primary-grad);
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 14px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card-light); padding: 12px 18px; border-radius: 12px;
      border-left: 4px solid var(--primary);
    }
    .badge {
      padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase; background: rgba(99,102,241,0.2); color: #a5b4fc;
    }
    .badge.running { background: rgba(56,189,248,0.2); color: #38bdf8; }
    .badge.waiting_for_input { background: rgba(245,158,11,0.25); color: #fbbf24; }
    .badge.succeeded { background: rgba(16,185,129,0.25); color: #34d399; }
    .badge.failed { background: rgba(244,63,94,0.25); color: #fb7185; }

    .hitl-box {
      background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(236,72,153,0.15));
      border: 1px solid #f59e0b;
      border-radius: 14px;
      padding: 18px;
      display: none;
    }
    .hitl-box h3 { color: #fbbf24; margin-bottom: 8px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .chip {
      background: #0f172a; border: 1px solid #f59e0b; color: #fde68a;
      padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 0.85rem;
    }
    .chip:hover { background: #f59e0b; color: #0f172a; font-weight: 700; }

    .thought-box {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      max-height: 210px;
      overflow-y: auto;
      font-family: Consolas, monospace;
      font-size: 0.84rem;
      color: #cbd5e1;
      white-space: pre-wrap;
    }

    .stage-card { border-top: 4px solid var(--primary); }
    .stage-venue { border-top-color: var(--venue-accent); }
    .stage-logistics { border-top-color: var(--logistics-accent); }
    .stage-marketing { border-top-color: var(--marketing-accent); }
    .stage-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; }

    .pill {
      display: inline-block; padding: 4px 10px; border-radius: 8px;
      background: rgba(255,255,255,0.08); font-size: 0.82rem; margin: 3px 4px 3px 0;
    }
    .link-btn {
      display: inline-block; margin-top: 10px; margin-right: 10px;
      padding: 8px 14px; border-radius: 8px; text-decoration: none;
      background: rgba(56,189,248,0.2); color: #38bdf8; border: 1px solid #38bdf8;
      font-weight: 600; font-size: 0.88rem;
    }
    .link-btn:hover { background: #38bdf8; color: #0f172a; }
    .contact-pill {
      display: inline-block; margin-top: 10px; padding: 8px 14px; border-radius: 8px;
      background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid #10b981;
      font-weight: 600; font-size: 0.88rem;
    }
    .invite-box {
      background: #0f172a; padding: 14px; border-radius: 10px;
      border-left: 3px solid var(--marketing-accent); white-space: pre-wrap; margin-top: 8px;
    }
    .err-msg { color: #fb7185; font-size: 0.9rem; margin-top: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>✨ AI Event Management Planner</h1>
    <p>Multi-Agent Venue Discovery • Smart Logistics • Custom Invitations</p>
  </header>

  <div class="container">
    <div class="card">
      <div class="grid-2">
        <div>
          <label>Event Topic</label>
          <input id="event_topic" value="Tech Founders Meetup" />
        </div>
        <div>
          <label>City</label>
          <input id="city" value="Lucknow" />
        </div>
        <div>
          <label>Number of Guests</label>
          <input id="guests" type="number" value="80" />
        </div>
        <div>
          <label>Total Budget (₹)</label>
          <input id="total_budget" type="number" value="120000" />
        </div>
      </div>
      <div style="margin-top: 14px;">
        <label>Event Description & Special Preferences</label>
        <textarea id="description" rows="2">A vibrant evening networking meetup for startup founders with stage, projector, and dinner.</textarea>
      </div>
      <button class="btn" id="startBtn" onclick="startRun()">🚀 Plan My Event</button>
      <div id="formErr" class="err-msg"></div>
    </div>

    <div class="card" id="liveSection" style="display:none;">
      <div class="status-bar">
        <div><strong id="stepLabel">Initializing agents...</strong> <span id="runIdTxt" style="color:var(--muted); font-size:0.82rem;"></span></div>
        <span id="statusBadge" class="badge">queued</span>
      </div>

      <div class="hitl-box" id="hitlBox" style="margin-top: 16px;">
        <h3>🙋 Agent Needs Your Input</h3>
        <p id="qText" style="margin-bottom: 10px;"></p>
        <div class="chip-row" id="qOptions"></div>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <input id="ansInput" placeholder="Type your answer here..." />
          <button class="btn" style="margin-top:0;" onclick="submitAnswer()">Send</button>
        </div>
        <div id="ansErr" class="err-msg"></div>
      </div>

      <div style="margin-top: 16px;">
        <label>🧠 Live Agent Thinking & Tool Activity</label>
        <div class="thought-box" id="thoughtBox">Waiting for agent thoughts...</div>
      </div>
    </div>

    <div id="resultsArea" style="display:grid; gap:18px;"></div>
  </div>
  <script>
    let currentRunId = null;
    let currentQId = null;
    let evtSource = null;

    async function startRun() {
      const btn = document.getElementById("startBtn");
      const err = document.getElementById("formErr");
      err.textContent = "";
      btn.disabled = true;

      const payload = {
        event_topic: document.getElementById("event_topic").value,
        city: document.getElementById("city").value,
        guests: parseInt(document.getElementById("guests").value || "0", 10),
        total_budget: parseInt(document.getElementById("total_budget").value || "0", 10),
        description: document.getElementById("description").value
      };

      try {
        const res = await fetch("/runs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to start run");

        currentRunId = data.run_id;
        document.getElementById("liveSection").style.display = "block";
        document.getElementById("resultsArea").innerHTML = "";
        document.getElementById("thoughtBox").textContent = "";
        document.getElementById("runIdTxt").textContent = `(Run ID: ${currentRunId})`;
        connectSSE(currentRunId);
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
      }
    }

    function connectSSE(runId) {
      if (evtSource) evtSource.close();
      evtSource = new EventSource(`/runs/${runId}/events`);
      evtSource.onmessage = (e) => handleEvent(JSON.parse(e.data));
    }

    function handleEvent(ev) {
      const tb = document.getElementById("thoughtBox");
      if (ev.type === "status") {
        const b = document.getElementById("statusBadge");
        b.textContent = ev.data.status;
        b.className = `badge ${ev.data.status}`;
      } else if (ev.type === "step" || ev.type === "stage_started") {
        document.getElementById("stepLabel").textContent = ev.data.label || `Running ${ev.data.role}...`;
      } else if (ev.type === "thinking") {
        tb.textContent += ev.data.delta;
        tb.scrollTop = tb.scrollHeight;
      } else if (ev.type === "tool_started") {
        tb.textContent += `\n🔧 [Tool: ${ev.data.tool}] ${ev.data.args}\n`;
        tb.scrollTop = tb.scrollHeight;
      } else if (ev.type === "question") {
        currentQId = ev.data.id;
        document.getElementById("hitlBox").style.display = "block";
        document.getElementById("qText").textContent = ev.data.text;
        document.getElementById("ansErr").textContent = "";
        const optDiv = document.getElementById("qOptions");
        optDiv.innerHTML = "";
        (ev.data.options || []).forEach(opt => {
          const c = document.createElement("button");
          c.className = "chip";
          c.textContent = opt;
          c.onclick = () => { document.getElementById("ansInput").value = opt; submitAnswer(); };
          optDiv.appendChild(c);
        });
      } else if (ev.type === "answer_received") {
        document.getElementById("hitlBox").style.display = "none";
      } else if (ev.type === "stage_result") {
        renderStage(ev.data.stage, ev.data.data);
      } else if (ev.type === "error") {
        document.getElementById("stepLabel").textContent = ev.data.message || "Error occurred";
        document.getElementById("startBtn").disabled = false;
      } else if (ev.type === "done") {
        document.getElementById("stepLabel").textContent = ev.data.ok ? "🎉 Event Plan Ready!" : "❌ Run Failed";
        document.getElementById("startBtn").disabled = false;
        evtSource.close();
      }
    }

    async function submitAnswer() {
      const ans = document.getElementById("ansInput").value.trim();
      const err = document.getElementById("ansErr");
      err.textContent = "";
      if (!ans) return;
      try {
        const res = await fetch(`/runs/${currentRunId}/answer`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question_id: currentQId, answer: ans })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Invalid answer");
        document.getElementById("ansInput").value = "";
        document.getElementById("hitlBox").style.display = "none";
      } catch (e) {
        err.textContent = e.message;
      }
    }

    function renderStage(stage, d) {
      if (!d) return;
      const area = document.getElementById("resultsArea");
      let existing = document.getElementById(`card-${stage}`);
      if (!existing) {
        existing = document.createElement("div");
        existing.id = `card-${stage}`;
        existing.className = `card stage-card stage-${stage}`;
        area.appendChild(existing);
      }

      if (stage === "venue") {
        const hasUrl = d.website_url && d.website_url.startsWith("http");
        existing.innerHTML = `
          <div class="stage-title" style="color:var(--venue-accent)">🏨 Selected Venue</div>
          <h3>${d.venue_name}</h3>
          <p style="color:var(--muted); margin:4px 0 10px;">📍 ${d.address}</p>
          <div>
            <span class="pill">👥 Capacity: ${d.capacity}</span>
            <span class="pill">💰 Est. Cost: ₹${d.estimated_cost}</span>
            <span class="pill">🍽️ In-house Catering: ${d.has_inhouse_catering ? "Yes" : "No"}</span>
          </div>
          <div style="margin-top:8px;">
            ${(d.included_facilities || []).map(f => `<span class="pill">✅ ${f}</span>`).join("")}
          </div>
          <div>
            ${hasUrl ? `<a class="link-btn" href="${d.website_url}" target="_blank">🌐 Visit Hotel Website</a>` : `<span class="pill">🌐 Website: ${d.website_url || "Not listed"}</span>`}
            <span class="contact-pill">📞 Contact: ${d.contact_info || "Not listed"}</span>
          </div>
        `;
      } else if (stage === "logistics") {
        existing.innerHTML = `
          <div class="stage-title" style="color:var(--logistics-accent)">🚚 Logistics & Catering Plan</div>
          <p><strong>Caterer:</strong> ${d.catering_vendor} — ${d.catering_menu_summary}</p>
          <p style="margin-top:6px;"><strong>Additional Logistics Cost:</strong> ₹${d.estimated_logistics_cost}</p>
          <div style="margin-top:8px;">
            ${(d.equipment_list || []).map(eq => `<span class="pill">🎛️ ${eq}</span>`).join("")}
          </div>
        `;
      } else if (stage === "marketing") {
        existing.innerHTML = `
          <div class="stage-title" style="color:var(--marketing-accent)">📣 Marketing & Official Invitation</div>
          <p><strong>Target Audience:</strong> ${d.target_audience}</p>
          <div class="invite-box">${d.invitation_message}</div>
          <div style="margin-top:10px;">
            ${(d.social_media_posts || []).map(p => `<div class="pill" style="display:block; margin-top:6px;">📱 ${p}</div>`).join("")}
          </div>
        `;
      }
    }
  </script>
</body>
</html>
